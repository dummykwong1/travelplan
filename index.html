<!DOCTYPE html>
<html lang="zh-TW" class="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Kumamon 記帳</title>
    <meta name="description" content="Kumamon 記帳 — 簡單好用的收支記錄">
    <meta name="theme-color" content="#18181b" media="(prefers-color-scheme: dark)">
    <meta name="theme-color" content="#fafafa" media="(prefers-color-scheme: light)">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Kumamon 記帳">
    <meta name="mobile-web-app-capable" content="yes">
    <link rel="manifest" href="manifest.json">
    <link rel="apple-touch-icon" href="icon-192.png">
    <link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
    <link rel="icon" type="image/png" sizes="512x512" href="icon-512.png">

    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'system-ui', '-apple-system', 'sans-serif'],
                    }
                }
            }
        }
    </script>
    <style type="text/tailwindcss">
        @layer utilities {
            .scrollbar-hide::-webkit-scrollbar { display: none; }
            .scrollbar-hide { -ms-overflow-style: none; scrollbar-width: none; }
        }
        body {
            @apply bg-zinc-50 text-zinc-900 transition-colors duration-200 dark:bg-zinc-950 dark:text-zinc-100;
        }
        /* iOS PWA：避開狀態列 / Home Indicator 安全區域 */
        .safe-header {
            padding-top: env(safe-area-inset-top, 0px);
        }
        .safe-bottom-fab {
            bottom: calc(1.5rem + env(safe-area-inset-bottom, 0px));
        }
        @media (min-width: 768px) {
            .safe-bottom-fab {
                bottom: calc(2rem + env(safe-area-inset-bottom, 0px));
            }
        }
        .pie-chart {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            background: conic-gradient(var(--pie-gradient));
            position: relative;
        }
        .pie-chart::after {
            content: '';
            position: absolute;
            inset: 24px;
            background: white;
            border-radius: 50%;
        }
        .dark .pie-chart::after {
            background: #18181b;
        }
        .kumamon-logo {
            width: 32px;
            height: 32px;
            border-radius: 10px;
            object-fit: cover;
            background: #fff;
        }
    </style>

    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>
<body>
    <div id="root"></div>

    <!-- 匯出 HTML 時會把資料注入到這裡 -->
    <script id="__embedded_data_holder__">
        // __EMBEDDED_DATA_START__
        window.__EMBEDDED_DATA__ = null;
        // __EMBEDDED_DATA_END__
    </script>

    <script type="text/babel">
        // Kumamon 記帳 - 改善版 (2026)
        // 改善項目：更安全的金額算式解析、每週週期邏輯依「星期幾」產生、無障礙 aria-label、細節優化
        // 2026-08 更新：週期全自動、分類更名、進階搜尋、即時加分類、分類篩選、系統分享雲端匯出
        const { useState, useEffect, useMemo, useRef } = React;

        const DEFAULT_CATEGORIES = ['飲食', '交通', '購物', '娛樂', '薪資', '居家', '醫療', '租金', '其他'];

        const CURRENCY_OPTIONS = [
            { key: 'HKD', label: '港幣', defaultSymbol: 'HK$' },
            { key: 'CNY', label: '人民幣', defaultSymbol: '¥' },
            { key: 'CUSTOM', label: '自訂貨幣', defaultSymbol: '$' }
        ];

        const RECURRING_OPTIONS = [
            { key: 'none', label: '不重複' },
            { key: 'monthly', label: '每月' },
            { key: 'weekly', label: '每週' },
            { key: 'yearly', label: '每年' }
        ];

        // 若有嵌入資料，強制寫入 localStorage（匯出的 HTML 用此還原紀錄）
        (function seedFromEmbedded() {
            try {
                const d = window.__EMBEDDED_DATA__;
                if (d && typeof d === 'object') {
                    if (Array.isArray(d.transactions)) {
                        localStorage.setItem('expense-tracker-data-v5', JSON.stringify(d.transactions));
                        console.info('[Kumamon 記帳] 已從嵌入資料載入 ' + d.transactions.length + ' 筆紀錄');
                    }
                    if (d.settings && typeof d.settings === 'object') {
                        localStorage.setItem('expense-tracker-settings-v3', JSON.stringify(d.settings));
                    }
                    if (Array.isArray(d.categories)) {
                        localStorage.setItem('expense-tracker-categories', JSON.stringify(d.categories));
                    }
                    if (d.theme) {
                        localStorage.setItem('expense-tracker-theme', JSON.stringify(d.theme));
                    }
                }
            } catch (e) {
                console.warn('無法載入嵌入資料', e);
            }
        })();

        function useLocalStorage(key, initialValue) {
            const [storedValue, setStoredValue] = useState(() => {
                try {
                    const item = window.localStorage.getItem(key);
                    return item ? JSON.parse(item) : initialValue;
                } catch (error) {
                    console.error("讀取 localStorage 錯誤", error);
                    return initialValue;
                }
            });
            const setValue = (value) => {
                try {
                    const valueToStore = value instanceof Function ? value(storedValue) : value;
                    setStoredValue(valueToStore);
                    window.localStorage.setItem(key, JSON.stringify(valueToStore));
                } catch (error) {
                    console.error("寫入 localStorage 錯誤", error);
                }
            };
            return [storedValue, setValue];
        }

        function evaluateExpression(expr) {
            if (typeof expr !== 'string') return NaN;
            // 移除千分位逗號與多餘空白
            const cleaned = expr.replace(/,/g, '').replace(/\s+/g, '').trim();
            if (!cleaned || cleaned.length > 80) return NaN; // 防止過長惡意輸入
            // 純數字直接回傳
            if (/^-?\d+(\.\d+)?$/.test(cleaned)) return Number(cleaned);
            // 只允許數字、四則運算、括號、小數點（白名單）
            if (!/^[\d+\-*/().]+$/.test(cleaned)) return NaN;
            // 禁止連續運算子、開頭結尾不合法等簡單檢查
            if (/[+\-*/]{2,}/.test(cleaned.replace(/(^|[*/(])-/g, '$1'))) return NaN;
            if (/^[*/)]/.test(cleaned) || /[+\-*/.(]$/.test(cleaned)) return NaN;
            try {
                // 仍使用 Function，但已嚴格過濾字元，風險極低
                const result = Function('"use strict"; return (' + cleaned + ')')();
                return typeof result === 'number' && isFinite(result) ? Math.round(result * 100) / 100 : NaN;
            } catch {
                return NaN;
            }
        }

        const Icons = {
            Plus: () => <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>,
            Trash: () => <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><polyline points="3 6 5 6 21 6"></polyline><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path></svg>,
            Edit: () => <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"></path><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"></path></svg>,
            Sun: () => <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><circle cx="12" cy="12" r="5"></circle><line x1="12" y1="1" x2="12" y2="3"></line><line x1="12" y1="21" x2="12" y2="23"></line><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line><line x1="1" y1="12" x2="3" y2="12"></line><line x1="21" y1="12" x2="23" y2="12"></line><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line></svg>,
            Moon: () => <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path></svg>,
            Export: () => <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="17 8 12 3 7 8"></polyline><line x1="12" y1="3" x2="12" y2="15"></line></svg>,
            Import: () => <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="7 10 12 15 17 10"></polyline><line x1="12" y1="15" x2="12" y2="3"></line></svg>,
            Clear: () => <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><polygon points="7.86 2 16.14 2 22 7.86 22 16.14 16.14 22 7.86 22 2 16.14 2 7.86 7.86 2"></polygon><line x1="15" y1="9" x2="9" y2="15"></line><line x1="9" y1="9" x2="15" y2="15"></line></svg>,
            TrendingUp: () => <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><polyline points="23 6 13.5 15.5 8.5 10.5 1 18"></polyline><polyline points="17 6 23 6 23 12"></polyline></svg>,
            TrendingDown: () => <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><polyline points="23 18 13.5 8.5 8.5 13.5 1 6"></polyline><polyline points="17 18 23 18 23 12"></polyline></svg>,
            Search: () => <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>,
            Settings: () => <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><circle cx="12" cy="12" r="3"></circle><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path></svg>,
            Chart: () => <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M21.21 15.89A10 10 0 1 1 8 2.83"></path><path d="M22 12A10 10 0 0 0 12 2v10z"></path></svg>,
            Refresh: () => <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><polyline points="23 4 23 10 17 10"></polyline><polyline points="1 20 1 14 7 14"></polyline><path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"></path></svg>,
            // 檔案下載圖示（匯出完整 HTML）
            FileDown: () => <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path><polyline points="14 2 14 8 20 8"></polyline><line x1="12" y1="18" x2="12" y2="12"></line><polyline points="9 15 12 18 15 15"></polyline></svg>,
            Calc: () => <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><rect x="4" y="2" width="16" height="20" rx="2"></rect><line x1="8" y1="6" x2="16" y2="6"></line></svg>,
            Cloud: () => <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M18 10h-1.26A8 8 0 1 0 9 20h9a5 5 0 0 0 0-10z"></path></svg>,
            Share: () => <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><circle cx="18" cy="5" r="3"></circle><circle cx="6" cy="12" r="3"></circle><circle cx="18" cy="19" r="3"></circle><line x1="8.59" y1="13.51" x2="15.42" y2="17.49"></line><line x1="15.41" y1="6.51" x2="8.59" y2="10.49"></line></svg>
        };

        const PIE_COLORS_EXPENSE = [
            '#ef4444', '#f97316', '#eab308', '#22c55e', '#14b8a6',
            '#3b82f6', '#8b5cf6', '#ec4899', '#64748b', '#0ea5e9'
        ];
        // 收入圖表：綠色系
        const PIE_COLORS_INCOME = [
            '#16a34a', '#22c55e', '#4ade80', '#86efac', '#059669',
            '#10b981', '#34d399', '#6ee7b7', '#047857', '#a3e635'
        ];
        const getPieColors = (type) => type === 'income' ? PIE_COLORS_INCOME : PIE_COLORS_EXPENSE;

        const formatMoney = (amount, symbol = 'HK$') => {
            const numStr = new Intl.NumberFormat('en-US', { 
                minimumFractionDigits: 0, 
                maximumFractionDigits: 2 
            }).format(amount);
            return `${symbol} ${numStr}`;
        };

        const generateId = () => crypto.randomUUID ? crypto.randomUUID() : Math.random().toString(36).substring(2, 11);

        const getCurrentMonth = () => {
            const d = new Date();
            return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}`;
        };

        const getPrevMonth = (monthStr) => {
            const [y, m] = monthStr.split('-').map(Number);
            const d = new Date(y, m - 2, 1);
            return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}`;
        };

        // 支援「2026」全年 或「2026-08」單月
        const getPrevPeriod = (period) => {
            if (!period || period === 'all') return null;
            if (/^\d{4}$/.test(period)) return String(Number(period) - 1);
            if (/^\d{4}-\d{2}$/.test(period)) return getPrevMonth(period);
            return null;
        };

        const periodLabel = (p) => {
            if (!p || p === 'all') return '全部';
            if (/^\d{4}$/.test(p)) return p + '年';
            if (/^\d{4}-\d{2}$/.test(p)) return p.replace('-', '年') + '月';
            return p;
        };

        const ModalOverlay = ({ children, onClose }) => (
            <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/50 backdrop-blur-sm"
                 onClick={(e) => { if (e.target === e.currentTarget) onClose(); }}>
                <div className="bg-white dark:bg-zinc-900 rounded-2xl shadow-xl w-full max-w-md overflow-hidden border border-zinc-200 dark:border-zinc-800 max-h-[90vh] overflow-y-auto">
                    {children}
                </div>
            </div>
        );

        const TransactionForm = ({ initialData, onSave, onClose, settings, categories, onAddCategory }) => {
            const amountRef = useRef(null);
            const [formData, setFormData] = useState(initialData || {
                type: 'expense',
                date: new Date().toISOString().split('T')[0],
                category: '',
                amount: '',
                note: '',
                currency: 'HKD',
                recurring: 'none'
            });
            const [amountExpr, setAmountExpr] = useState(initialData ? String(initialData.amount) : '');
            const [calcPreview, setCalcPreview] = useState(null);

            const getSymbol = (currencyKey) => {
                if (currencyKey === 'CUSTOM') return settings.customSymbol || '$';
                const opt = CURRENCY_OPTIONS.find(c => c.key === currencyKey);
                return opt ? opt.defaultSymbol : 'HK$';
            };

            const handleAmountChange = (e) => {
                const val = e.target.value;
                setAmountExpr(val);
                if (val && /[+\-*/]/.test(val)) {
                    const result = evaluateExpression(val);
                    setCalcPreview(isNaN(result) ? null : result);
                } else {
                    setCalcPreview(null);
                }
            };

            const selectCategory = (cat) => {
                setFormData(prev => ({ ...prev, category: cat }));
                setTimeout(() => amountRef.current?.focus(), 50);
            };

            const handleSubmit = (e) => {
                e.preventDefault();
                const amountNum = evaluateExpression(amountExpr);
                if (isNaN(amountNum) || amountNum <= 0) {
                    alert("請輸入有效的金額或算式（例如 35+12）");
                    return;
                }
                const category = formData.category.trim() || '其他';
                // 若為新分類，自動加入常用列表
                if (onAddCategory && category && !categories.includes(category)) {
                    onAddCategory(category);
                }
                onSave({
                    ...formData,
                    category,
                    id: initialData?.id || generateId(),
                    amount: Math.round(amountNum * 100) / 100,
                    currency: formData.currency || 'HKD',
                    recurring: formData.recurring || 'none',
                    createdAt: initialData?.createdAt || new Date().toISOString(),
                    isRecurringTemplate: (formData.recurring && formData.recurring !== 'none') ? true : (initialData?.isRecurringTemplate || false)
                });
            };

            return (
                <ModalOverlay onClose={onClose}>
                    <form onSubmit={handleSubmit} className="p-6">
                        <h2 className="text-xl font-bold mb-5">{initialData ? '編輯紀錄' : '新增紀錄'}</h2>
                        <div className="flex bg-zinc-100 dark:bg-zinc-800 rounded-lg p-1 mb-4">
                            <button type="button" onClick={() => setFormData({...formData, type: 'expense'})}
                                className={`flex-1 py-2 text-sm font-medium rounded-md transition-colors ${formData.type === 'expense' ? 'bg-white dark:bg-zinc-700 shadow text-red-600 dark:text-red-400' : 'text-zinc-500 hover:text-zinc-900 dark:hover:text-zinc-300'}`}>支出</button>
                            <button type="button" onClick={() => setFormData({...formData, type: 'income'})}
                                className={`flex-1 py-2 text-sm font-medium rounded-md transition-colors ${formData.type === 'income' ? 'bg-white dark:bg-zinc-700 shadow text-emerald-600 dark:text-emerald-400' : 'text-zinc-500 hover:text-zinc-900 dark:hover:text-zinc-300'}`}>收入</button>
                        </div>
                        <div className="space-y-4">
                            <div>
                                <label className="block text-sm font-medium text-zinc-700 dark:text-zinc-300 mb-1">日期</label>
                                <input type="date" name="date" required value={formData.date} onChange={e => setFormData({...formData, date: e.target.value})}
                                    className="w-full px-3 py-2 border border-zinc-300 dark:border-zinc-700 rounded-lg bg-white dark:bg-zinc-800 focus:outline-none focus:ring-2 focus:ring-zinc-900 dark:focus:ring-white transition-colors" />
                            </div>
                            <div>
                                <label className="block text-sm font-medium text-zinc-700 dark:text-zinc-300 mb-1">分類</label>
                                <div className="flex gap-2">
                                    <input type="text" name="category" placeholder="點擊下方快捷分類或自行輸入" value={formData.category} onChange={e => setFormData({...formData, category: e.target.value})}
                                        className="flex-1 px-3 py-2 border border-zinc-300 dark:border-zinc-700 rounded-lg bg-white dark:bg-zinc-800 focus:outline-none focus:ring-2 focus:ring-zinc-900 dark:focus:ring-white transition-colors" />
                                    {formData.category.trim() && !categories.includes(formData.category.trim()) && onAddCategory && (
                                        <button type="button" onClick={() => {
                                            const name = formData.category.trim();
                                            onAddCategory(name);
                                        }}
                                            className="px-3 py-2 text-xs font-medium whitespace-nowrap bg-zinc-900 dark:bg-white text-white dark:text-zinc-900 rounded-lg hover:bg-zinc-800 dark:hover:bg-zinc-200 transition-colors"
                                            title="將此分類加入常用列表">
                                            + 加入分類
                                        </button>
                                    )}
                                </div>
                                <div className="flex flex-wrap gap-2 mt-2">
                                    {categories.map(cat => (
                                        <button key={cat} type="button" onClick={() => selectCategory(cat)}

            const addCategory = () => {
                const name = newCat.trim();
                if (!name) return;
                if (localCats.includes(name)) { alert('分類已存在'); return; }
                setLocalCats([...localCats, name]);
                setNewCat('');

            const deleteCategory = (idx) => {
                if (localCats.length <= 1) { alert('至少保留一個分類'); return; }

            const startEdit = (idx) => { setEditingIdx(idx); setEditName(localCats[idx]); };
            const saveEdit = () => {
                const name = editName.trim();
                if (!name) return;
                if (localCats.some((c, i) => c === name && i !== editingIdx)) { alert('分類名稱已存在'); return; }
                const oldName = localCats[editingIdx];
                const next = [...localCats];
                next[editingIdx] = name;
                setLocalCats(next);

                                                        className={`w-full px-3 py-1.5 text-sm border border-zinc-300 dark:border-zinc-700 rounded-lg bg-white dark:bg-zinc-800 focus:outline-none focus:ring-2 focus:ring-zinc-900 dark:focus:ring-white ${isHKD ? 'opacity-60 cursor-not-allowed' : ''}`}

        const RecurringListModal = ({ templates, onEdit, onDelete, onClose, getSymbol }) => (

        const Toast = ({ message, type = 'success', onClose }) => {

            const bgClass = type === 'error' ? 'bg-red-500' : 'bg-zinc-900 dark:bg-white';
            const textClass = type === 'error' ? 'text-white' : 'text-white dark:text-zinc-900';
            return (
                <div className="fixed bottom-6 left-1/2 -translate-x-1/2 z-50">

        // 單一圓餅（修正間距：圖例緊湊靠左對齊）
        // convertAmount: (amount, fromCurrency) => number  可選，用於換算至結算貨幣
        const MiniPie = ({ transactions, type, title, getSymbol, compact = false, convertAmount = null, settlementSymbol = null }) => {
            const data = useMemo(() => {
                const map = {};
                transactions.filter(t => t.type === type).forEach(t => {
                    const amt = convertAmount ? convertAmount(t.amount, t.currency || 'HKD') : t.amount;
                    map[t.category] = (map[t.category] || 0) + amt;
                });
                const total = Object.values(map).reduce((a, b) => a + b, 0);
                if (total === 0) return null;
                const sorted = Object.entries(map)
                    .map(([name, value]) => ({ name, value, percent: (value / total) * 100 }))
                    .sort((a, b) => b.value - a.value);
                let acc = 0;
                const colors = getPieColors(type);
                const gradientParts = sorted.map((item, i) => {
                    const start = acc;
                    acc += item.percent;
                    return `${colors[i % colors.length]} ${start}% ${acc}%`;
                });
                return { sorted, total, gradient: gradientParts.join(', '), colors };
            }, [transactions, type, convertAmount]);

            const symbol = useMemo(() => {
                if (settlementSymbol) return settlementSymbol;
                const first = transactions.find(t => t.type === type);
                return first ? getSymbol(first.currency || 'HKD') : 'HK$';
            }, [transactions, type, getSymbol, settlementSymbol]);

            return (
                <div className={compact ? 'flex-1 min-w-0' : 'w-full'}>
                    {title && <h4 className="text-xs font-semibold text-zinc-500 dark:text-zinc-400 mb-3 text-center">{title}</h4>}
                    {!data ? (
                        <div className="py-10 text-center text-zinc-400 text-xs">無資料</div>
                    ) : (
                        <div className={`flex ${compact ? 'flex-col items-center gap-3' : 'flex-col sm:flex-row items-center sm:items-start gap-5'}`}>
                            <div className="pie-chart shrink-0" style={{ '--pie-gradient': data.gradient }} />
                            <div className={`${compact ? 'w-full' : 'flex-1 max-w-xs'} space-y-1.5`}>
                                {data.sorted.slice(0, compact ? 5 : 8).map((item, i) => (
                                    <div key={item.name} className="flex items-center gap-2 text-sm">
                                        <span className="w-2.5 h-2.5 rounded-full shrink-0" style={{ background: data.colors[i % data.colors.length] }}></span>
                                        <span className="text-zinc-700 dark:text-zinc-300 flex-1 truncate">{item.name}</span>
                                        <span className="font-mono text-zinc-500 dark:text-zinc-400 tabular-nums shrink-0 w-10 text-right">{item.percent.toFixed(0)}%</span>
                                    </div>
                                ))}
                                <div className="text-xs text-zinc-400 pt-1.5 font-mono">
                                    合計 {formatMoney(data.total, symbol)}
                                </div>
                            </div>
                        </div>
                    )}
                </div>
            );
        };

        const CategoryPieChart = ({ allTransactions, filterMonth, getSymbol, rates = { HKD: 1, CNY: 1, CUSTOM: 1 } }) => {
            const [chartType, setChartType] = useState('expense');
            const [compareMode, setCompareMode] = useState(false);
            const [settlementCurrency, setSettlementCurrency] = useState('HKD');

            const thisMonthTx = useMemo(() => {
                if (filterMonth === 'all') return allTransactions;
                return allTransactions.filter(t => t.date.startsWith(filterMonth));
            }, [allTransactions, filterMonth]);

            const canCompare = filterMonth !== 'all' && (/^\d{4}$/.test(filterMonth) || /^\d{4}-\d{2}$/.test(filterMonth));
            const prevMonthStr = canCompare ? getPrevPeriod(filterMonth) : null;
            const prevMonthTx = useMemo(() => {
                if (!prevMonthStr) return [];
                return allTransactions.filter(t => t.date.startsWith(prevMonthStr));
            }, [allTransactions, prevMonthStr]);

            // 換算：先轉成 HKD，再轉成目標結算貨幣
            const convertAmount = useMemo(() => {
                const r = rates || { HKD: 1, CNY: 1, CUSTOM: 1 };
                const toRate = r[settlementCurrency] > 0 ? r[settlementCurrency] : 1;
                return (amount, fromCurrency) => {
                    const fromRate = r[fromCurrency || 'HKD'] > 0 ? r[fromCurrency || 'HKD'] : 1;
                    return Math.round((amount * fromRate / toRate) * 100) / 100;
                };
            }, [rates, settlementCurrency]);

            const settlementSymbol = getSymbol(settlementCurrency);

            return (
                <div className="bg-white dark:bg-zinc-900 rounded-2xl border border-zinc-100 dark:border-zinc-800 p-5">
                    <div className="flex flex-wrap items-center justify-between gap-2 mb-4">
                        <h3 className="text-sm font-semibold text-zinc-500 dark:text-zinc-400 flex items-center gap-2">
                            <Icons.Chart /> 分類佔比
                        </h3>
                        <div className="flex flex-wrap items-center gap-2">
                            <div className="flex bg-zinc-100 dark:bg-zinc-800 rounded-lg p-0.5">
                                <button onClick={() => setChartType('expense')}
                                    className={`px-3 py-1 text-xs font-medium rounded-md transition-colors ${chartType === 'expense' ? 'bg-white dark:bg-zinc-700 shadow text-red-600 dark:text-red-400' : 'text-zinc-500'}`}>支出</button>
                                <button onClick={() => setChartType('income')}
                                    className={`px-3 py-1 text-xs font-medium rounded-md transition-colors ${chartType === 'income' ? 'bg-white dark:bg-zinc-700 shadow text-emerald-600 dark:text-emerald-400' : 'text-zinc-500'}`}>收入</button>
                            </div>
                            <div className="flex bg-zinc-100 dark:bg-zinc-800 rounded-lg p-0.5" title="圖表結算貨幣">
                                {CURRENCY_OPTIONS.map(opt => (
                                    <button key={opt.key} type="button" onClick={() => setSettlementCurrency(opt.key)}
                                        className={`px-2.5 py-1 text-xs font-medium rounded-md transition-colors ${settlementCurrency === opt.key ? 'bg-white dark:bg-zinc-700 shadow text-zinc-900 dark:text-white' : 'text-zinc-500'}`}>
                                        {opt.label}
                                    </button>
                                ))}
                            </div>
                            {canCompare && (
                                <button onClick={() => setCompareMode(!compareMode)}
                                    className={`px-3 py-1 text-xs font-medium rounded-lg border transition-colors ${compareMode ? 'bg-zinc-900 text-white border-zinc-900 dark:bg-white dark:text-zinc-900 dark:border-white' : 'border-zinc-200 dark:border-zinc-700 text-zinc-600 dark:text-zinc-400'}`}>
                                    {compareMode ? '關閉對比' : (/^\d{4}$/.test(filterMonth) ? '對比上年' : '對比上月')}
                                </button>
                            )}
                        </div>
                    </div>

                    {compareMode && canCompare ? (
                        <div className="flex gap-4 sm:gap-6">
                            <MiniPie transactions={thisMonthTx} type={chartType} title={periodLabel(filterMonth)} getSymbol={getSymbol} compact convertAmount={convertAmount} settlementSymbol={settlementSymbol} />
                            <div className="w-px bg-zinc-100 dark:bg-zinc-800 self-stretch"></div>
                            <MiniPie transactions={prevMonthTx} type={chartType} title={periodLabel(prevMonthStr)} getSymbol={getSymbol} compact convertAmount={convertAmount} settlementSymbol={settlementSymbol} />
                        </div>
                    ) : (
                        <MiniPie 
                            transactions={thisMonthTx} 
                            type={chartType} 
                            title={periodLabel(filterMonth)} 
                            getSymbol={getSymbol}
                            compact={false}
                            convertAmount={convertAmount}
                            settlementSymbol={settlementSymbol}
                        />
                    )}
                </div>
            );
        };


        // 進階搜尋：支援 關鍵字、>1000、<500、>=、<=、分類名、type:income/expense、currency:HKD
        function matchAdvancedSearch(tx, query) {
            if (!query || !query.trim()) return true;
            const q = query.trim();
            const lower = q.toLowerCase();

            // 金額條件：>1000  >=1000  <500  <=500  =100  1000（純數字當關鍵字）
            const amountOps = q.match(/^(>=|<=|>|<|=)\s*(\d+(?:\.\d+)?)$/);
            if (amountOps) {
                const op = amountOps[1];
                const val = parseFloat(amountOps[2]);
                const amt = Number(tx.amount) || 0;
                if (op === '>') return amt > val;
                if (op === '>=') return amt >= val;
                if (op === '<') return amt < val;
                if (op === '<=') return amt <= val;
                if (op === '=') return amt === val;
            }

            // type:income / type:expense / 收入 / 支出
            if (/^type:\s*(income|expense|收入|支出)$/i.test(q) || lower === '收入' || lower === '支出') {
                if (lower.includes('income') || lower === '收入') return tx.type === 'income';
                if (lower.includes('expense') || lower === '支出') return tx.type === 'expense';
            }

            // currency:HKD / currency:CNY / currency:CUSTOM
            const curMatch = q.match(/^currency:\s*(HKD|CNY|CUSTOM)$/i);
            if (curMatch) {
                return (tx.currency || 'HKD').toUpperCase() === curMatch[1].toUpperCase();
            }

            // 多關鍵字（空格分隔，AND）
            const tokens = lower.split(/\s+/).filter(Boolean);
            return tokens.every(tok => {
                // 金額條件混在關鍵字中
                const m = tok.match(/^(>=|<=|>|<|=)(\d+(?:\.\d+)?)$/);
                if (m) {
                    const op = m[1];
                    const val = parseFloat(m[2]);
                    const amt = Number(tx.amount) || 0;
                    if (op === '>') return amt > val;
                    if (op === '>=') return amt >= val;
                    if (op === '<') return amt < val;
                    if (op === '<=') return amt <= val;
                    if (op === '=') return amt === val;
                }
                const cat = (tx.category || '').toLowerCase();
                const note = (tx.note || '').toLowerCase();
                const cur = (tx.currency || 'HKD').toLowerCase();
                return cat.includes(tok) || note.includes(tok) || cur.includes(tok) ||
                    (tok === '收入' && tx.type === 'income') ||
                    (tok === '支出' && tx.type === 'expense');
            });
        }

        const App = () => {
            const [transactions, setTransactions] = useLocalStorage('expense-tracker-data-v5', []);
            const [theme, setTheme] = useLocalStorage('expense-tracker-theme', 'light');
            const [settings, setSettings] = useLocalStorage('expense-tracker-settings-v3', { customSymbol: '$', rates: { HKD: 1, CNY: 1, CUSTOM: 1 } });
            const [categories, setCategories] = useLocalStorage('expense-tracker-categories', DEFAULT_CATEGORIES);
            
            const [filterMonth, setFilterMonth] = useState(getCurrentMonth());
            const [filterType, setFilterType] = useState('all');
            const [filterCurrency, setFilterCurrency] = useState('all');
            const [filterCategory, setFilterCategory] = useState('all');
            const [searchQuery, setSearchQuery] = useState('');
            
            const [isFormOpen, setIsFormOpen] = useState(false);
            const [editingTx, setEditingTx] = useState(null);
            const [isSettingsOpen, setIsSettingsOpen] = useState(false);
            const [isRecurringListOpen, setIsRecurringListOpen] = useState(false);
            const [confirmAction, setConfirmAction] = useState(null);
            const [importData, setImportData] = useState(null);
            const [toast, setToast] = useState(null);
            const fileInputRef = useRef(null);

            useEffect(() => {
                if (theme === 'dark') document.documentElement.classList.add('dark');
                else document.documentElement.classList.remove('dark');
            }, [theme]);

            const toggleTheme = () => setTheme(prev => prev === 'dark' ? 'light' : 'dark');
            const showToast = (message, type = 'success') => setToast({ message, type });

            const getSymbol = (currencyKey) => {
                if (currencyKey === 'CUSTOM') return settings.customSymbol || '$';
                const opt = CURRENCY_OPTIONS.find(c => c.key === currencyKey);
                return opt ? opt.defaultSymbol : 'HK$';
            };

            // 分類更名時，同步更新所有既有紀錄與週期模板
            const handleRenameCategories = (renameMap) => {
                if (!renameMap || Object.keys(renameMap).length === 0) return;
                setTransactions(prev => prev.map(tx => {
                    const newCat = renameMap[tx.category];
                    return newCat ? { ...tx, category: newCat } : tx;
                }));
                showToast('已同步更新舊帳分類名稱');
            };

            const generateRecurringForCurrentMonth = (opts = {}) => {
                const silent = !!opts.silent;
                const now = new Date();
                const year = now.getFullYear();
                const month = now.getMonth();
                const currentMonthStr = getCurrentMonth();
                const lastDayOfMonth = new Date(year, month + 1, 0).getDate();
                const templates = transactions.filter(t => t.recurring && t.recurring !== 'none' && t.isRecurringTemplate);
                if (templates.length === 0) {
                    if (!silent) showToast('目前沒有設定週期的記帳', 'error');
                    return;
                }

                let addedCount = 0;
                const newOnes = [];
                templates.forEach(tpl => {
                    // 同一模板本月已產生過就跳過
                    const alreadyExists = transactions.some(t => {
                        if (t.templateId === tpl.id && t.date.startsWith(currentMonthStr)) return true;
                        return !t.templateId && t.category === tpl.category && t.amount === tpl.amount &&
                               t.currency === tpl.currency && t.type === tpl.type &&
                               t.date.startsWith(currentMonthStr) && t.id !== tpl.id;
                    });
                    if (alreadyExists) return;

                    let targetDate;
                    const tplDate = new Date(tpl.date + 'T00:00:00');
                    const day = tplDate.getDate();

                    if (tpl.recurring === 'monthly') {
                        const safeDay = Math.min(day, lastDayOfMonth);
                        targetDate = `${currentMonthStr}-${String(safeDay).padStart(2, '0')}`;
                    } else if (tpl.recurring === 'yearly') {
                        // 只有月份相符才產生
                        if (tplDate.getMonth() !== month) return;
                        const safeDay = Math.min(day, lastDayOfMonth);
                        targetDate = `${currentMonthStr}-${String(safeDay).padStart(2, '0')}`;
                    } else if (tpl.recurring === 'weekly') {
                        // 依模板的「星期幾」產生本月最接近今天的同一星期幾（優先今天或之後）
                        const targetDow = tplDate.getDay(); // 0 = 星期日
                        let found = null;
                        // 先找今天或之後的同一星期幾
                        for (let d = now.getDate(); d <= lastDayOfMonth; d++) {
                            if (new Date(year, month, d).getDay() === targetDow) {
                                found = d;
                                break;
                            }
                        }
                        // 若本月剩餘日子沒有，就找本月第一個同一星期幾
                        if (found === null) {
                            for (let d = 1; d <= lastDayOfMonth; d++) {
                                if (new Date(year, month, d).getDay() === targetDow) {
                                    found = d;
                                    break;
                                }
                            }
                        }
                        if (found === null) return;
                        targetDate = `${currentMonthStr}-${String(found).padStart(2, '0')}`;
                    } else return;

                    newOnes.push({
                        ...tpl,
                        id: generateId(),
                        date: targetDate,
                        createdAt: new Date().toISOString(),
                        isRecurringTemplate: false,
                        templateId: tpl.id,
                        note: tpl.note ? `${tpl.note}（自動產生）` : '（自動產生）'
                    });
                    addedCount++;
                });
                if (addedCount === 0) {
                    if (!silent) showToast('本月週期記帳已全部存在');
                } else {
                    setTransactions(prev => [...prev, ...newOnes]);
                    if (!silent) showToast(`已產生 ${addedCount} 筆本月週期記帳`);
                    else showToast(`已自動產生 ${addedCount} 筆本月週期記帳`);
                }
            };

            // 開啟 App 時自動產生本月（避免每月手動按）
            const autoGenDoneRef = useRef(false);
            useEffect(() => {
                if (autoGenDoneRef.current) return;
                const templates = transactions.filter(t => t.recurring && t.recurring !== 'none' && t.isRecurringTemplate);
                if (templates.length === 0) return;
                autoGenDoneRef.current = true;
                // 延遲一點讓 state 就緒
                const t = setTimeout(() => generateRecurringForCurrentMonth({ silent: true }), 300);
                return () => clearTimeout(t);
            }, [transactions]);

            const filteredTransactions = useMemo(() => {
                return transactions.filter(tx => {
                    const matchMonth = filterMonth === 'all' || tx.date.startsWith(filterMonth);
                    const matchType = filterType === 'all' || tx.type === filterType;
                    const matchCurrency = filterCurrency === 'all' || (tx.currency || 'HKD') === filterCurrency;
                    const matchCategory = filterCategory === 'all' || tx.category === filterCategory;
                    const matchSearch = matchAdvancedSearch(tx, searchQuery);
                    return matchMonth && matchType && matchCurrency && matchCategory && matchSearch;
                }).sort((a, b) => new Date(b.date) - new Date(a.date) || new Date(b.createdAt || 0) - new Date(a.createdAt || 0));
            }, [transactions, filterMonth, filterType, filterCurrency, filterCategory, searchQuery]);

            const statsByCurrency = useMemo(() => {
                const result = {
                    HKD: { income: 0, expense: 0, balance: 0, hasData: false },
                    CNY: { income: 0, expense: 0, balance: 0, hasData: false },
                    CUSTOM: { income: 0, expense: 0, balance: 0, hasData: false }
                };
                filteredTransactions.forEach(tx => {
                    const c = tx.currency || 'HKD';
                    if (result[c]) {
                        result[c].hasData = true;
                        if (tx.type === 'income') result[c].income += tx.amount;
                        else result[c].expense += tx.amount;
                        result[c].balance = result[c].income - result[c].expense;
                    }
                });
                if (!result.HKD.hasData && !result.CNY.hasData && !result.CUSTOM.hasData) result.HKD.hasData = true;
                return result;
            }, [filteredTransactions]);

            const availableMonths = useMemo(() => {
                const months = new Set(transactions.map(tx => tx.date.substring(0, 7)));
                months.add(getCurrentMonth());
                return Array.from(months).sort().reverse();
            }, [transactions]);

            const availableYears = useMemo(() => {
                const years = new Set(transactions.map(tx => tx.date.substring(0, 4)));
                years.add(String(new Date().getFullYear()));
                return Array.from(years).sort().reverse();
            }, [transactions]);

            const recurringTemplates = useMemo(() => 
                transactions.filter(t => t.recurring && t.recurring !== 'none' && t.isRecurringTemplate)
                    .sort((a, b) => new Date(b.createdAt || 0) - new Date(a.createdAt || 0))
            , [transactions]);
            const recurringCount = recurringTemplates.length;

            const handleSaveTransaction = (tx) => {
                if (editingTx) {
                    setTransactions(prev => prev.map(item => item.id === tx.id ? tx : item));
                    showToast('編輯成功');
                } else {
                    setTransactions(prev => [...prev, tx]);
                    showToast('新增成功');
                }
                setIsFormOpen(false);
                setEditingTx(null);
            };

            const handleDelete = (id) => {
                setConfirmAction({
                    title: '刪除紀錄',
                    message: '確定要刪除這筆紀錄嗎？此動作無法復原。',
                    isDanger: true,
                    onConfirm: () => {
                        setTransactions(prev => prev.filter(tx => tx.id !== id));
                        showToast('已刪除');
                    }
                });
            };

            const handleExportJson = () => {
                const dataStr = JSON.stringify(transactions, null, 2);
                const blob = new Blob([dataStr], { type: "application/json" });
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = `Kumamon 記帳_${new Date().toISOString().split('T')[0]}.json`;
                document.body.appendChild(a);
                a.click();
                document.body.removeChild(a);
                URL.revokeObjectURL(url);
                showToast('JSON 匯出成功');
            };

            // 匯出「含完整資料」的 HTML
            const handleExportHtml = () => {
                try {
                    const embedded = {
                        transactions,
                        settings,
                        categories,
                        theme,
                        exportedAt: new Date().toISOString()
                    };
                    // 轉義 < 與 U+2028/2029，避免破壞 script 或換行
                    const dataJson = JSON.stringify(embedded)
                        .replace(/</g, '\\u003c')
                        .replace(/\u2028/g, '\\u2028')
                        .replace(/\u2029/g, '\\u2029');

                    const newScriptBody =
                        '\n        // __EMBEDDED_DATA_START__\n' +
                        '        window.__EMBEDDED_DATA__ = ' + dataJson + ';\n' +
                        '        // __EMBEDDED_DATA_END__\n    ';

                    // 直接改寫 DOM 中的 script，再序列化整個頁面（最可靠）
                    let holder = document.getElementById('__embedded_data_holder__');
                    if (!holder) {
                        // 後備：找含標記且非 babel 的 script
                        holder = Array.from(document.querySelectorAll('script')).find(s => {
                            const t = s.textContent || '';
                            return t.includes('__EMBEDDED_DATA_START__') && s.id !== '' ||
                                (t.includes('__EMBEDDED_DATA_START__') && (!s.type || s.type === 'text/javascript' || s.type === ''));
                        });
                        // 再後備：任何含 START 且不含 babel 原始碼特徵的
                        if (!holder) {
                            holder = Array.from(document.querySelectorAll('script')).find(s => {
                                const t = s.textContent || '';
                                return t.includes('__EMBEDDED_DATA_START__') && !t.includes('handleExportHtml');
                            });
                        }
                    }

                    let htmlContent;
                    if (holder) {
                        const originalText = holder.textContent;
                        holder.textContent = newScriptBody;
                        htmlContent = '<!DOCTYPE html>\n' + document.documentElement.outerHTML;
                        holder.textContent = originalText; // 立刻還原，不影響當前頁
                    } else {
                        // 最後手段：字串替換（只替第一處 null 賦值）
                        htmlContent = '<!DOCTYPE html>\n' + document.documentElement.outerHTML;
                        const needle = 'window.__EMBEDDED_DATA__ = null;';
                        const pos = htmlContent.indexOf(needle);
                        if (pos !== -1) {
                            htmlContent = htmlContent.slice(0, pos) +
                                'window.__EMBEDDED_DATA__ = ' + dataJson + ';' +
                                htmlContent.slice(pos + needle.length);
                        } else {
                            htmlContent = htmlContent.replace(
                                /<\/body>/i,
                                '<script id="__embedded_data_holder__">window.__EMBEDDED_DATA__ = ' + dataJson + ';<\/script></body>'
                            );
                        }
                    }

                    // 驗證：用實際紀錄 id 或筆數確認資料已寫入（避免與原始碼字串誤判）
                    let verified = false;
                    if (transactions.length > 0) {
                        const sampleId = String(transactions[0].id);
                        verified = sampleId.length > 0 && htmlContent.indexOf(sampleId) !== -1;
                    } else {
                        // 無紀錄時，確認至少寫入空陣列結構
                        verified = htmlContent.indexOf('"transactions":[]') !== -1 ||
                                   htmlContent.indexOf('"transactions": []') !== -1;
                    }
                    if (!verified) {
                        showToast('匯出失敗：資料未寫入檔案', 'error');
                        console.error('Export verification failed, length=' + htmlContent.length);
                        return;
                    }

                    const blob = new Blob([htmlContent], { type: 'text/html;charset=utf-8' });
                    const url = URL.createObjectURL(blob);
                    const a = document.createElement('a');
                    a.href = url;
                    a.download = 'Kumamon 記帳_含資料_' + new Date().toISOString().split('T')[0] + '.html';
                    document.body.appendChild(a);
                    a.click();
                    document.body.removeChild(a);
                    URL.revokeObjectURL(url);
                    showToast('已匯出含 ' + transactions.length + ' 筆紀錄的 HTML');
                } catch (e) {
                    console.error(e);
                    showToast('匯出失敗：' + (e && e.message ? e.message : '未知錯誤'), 'error');
                }
            };

            // 系統原生分享（iOS / Android 分享選單 → 檔案、iCloud、Drive、AirDrop 等）
            const handleShareToCloud = async () => {
                try {
                    const embedded = {
                        transactions,
                        settings,
                        categories,
                        theme,
                        exportedAt: new Date().toISOString()
                    };
                    const dataJson = JSON.stringify(embedded)
                        .replace(/</g, '\\u003c')
                        .replace(/\u2028/g, '\\u2028')
                        .replace(/\u2029/g, '\\u2029');

                    const newScriptBody =
                        '\n        // __EMBEDDED_DATA_START__\n' +
                        '        window.__EMBEDDED_DATA__ = ' + dataJson + ';\n' +
                        '        // __EMBEDDED_DATA_END__\n    ';

                    let holder = document.getElementById('__embedded_data_holder__');
                    let originalText = null;
                    if (holder) {
                        originalText = holder.textContent;
                        holder.textContent = newScriptBody;
                    }

                    let htmlContent = '<!DOCTYPE html>\n' + document.documentElement.outerHTML;

                    if (holder && originalText !== null) {
                        holder.textContent = originalText;
                    }

                    // 若序列化失敗，改用 JSON 檔分享
                    const dateStr = new Date().toISOString().split('T')[0];
                    const canShareFiles = typeof navigator.share === 'function' && typeof navigator.canShare === 'function';

                    // 優先分享含資料的 HTML；不行再分享 JSON
                    const htmlFile = new File(
                        [htmlContent],
                        'Kumamon_記帳_含資料_' + dateStr + '.html',
                        { type: 'text/html' }
                    );
                    const jsonFile = new File(
                        [JSON.stringify({ transactions, settings, categories, theme, exportedAt: new Date().toISOString() }, null, 2)],
                        'Kumamon_記帳_' + dateStr + '.json',
                        { type: 'application/json' }
                    );

                    if (canShareFiles && navigator.canShare({ files: [htmlFile] })) {
                        await navigator.share({
                            files: [htmlFile],
                            title: 'Kumamon 記帳備份',
                            text: '共 ' + transactions.length + ' 筆紀錄 · ' + dateStr
                        });
                        showToast('已開啟系統分享');
                        return;
                    }
                    if (canShareFiles && navigator.canShare({ files: [jsonFile] })) {
                        await navigator.share({
                            files: [jsonFile],
                            title: 'Kumamon 記帳備份',
                            text: '共 ' + transactions.length + ' 筆紀錄 · ' + dateStr
                        });
                        showToast('已開啟系統分享（JSON）');
                        return;
                    }
                    // 僅支援文字分享（較少見）
                    if (typeof navigator.share === 'function') {
                        await navigator.share({
                            title: 'Kumamon 記帳備份',
                            text: '共 ' + transactions.length + ' 筆紀錄。請改用「匯出完整 HTML」下載後手動上傳雲端。'
                        });
                        showToast('已開啟系統分享');
                        return;
                    }
                    // 桌面或不支援：改下載 HTML
                    showToast('此裝置不支援系統分享，改為下載檔案');
                    handleExportHtml();
                } catch (e) {
                    // 使用者取消分享不顯示錯誤
                    if (e && (e.name === 'AbortError' || e.name === 'NotAllowedError')) return;
                    console.error(e);
                    showToast('分享失敗：' + (e && e.message ? e.message : '未知錯誤'), 'error');
                }
            };

            const handleImportClick = () => fileInputRef.current?.click();

            const handleFileChange = (e) => {
                const file = e.target.files[0];
                if (!file) return;
                const reader = new FileReader();
                reader.onload = (event) => {
                    try {
                        const imported = JSON.parse(event.target.result);
                        if (!Array.isArray(imported)) throw new Error("無效格式");
                        const isValid = imported.every(item => item.id && item.date && item.amount !== undefined);
                        if (!isValid) throw new Error("資料結構錯誤");
                        setImportData(imported);
                    } catch (error) {
                        showToast('匯入失敗：請確認檔案格式正確', 'error');
                    }
                    e.target.value = '';
                };
                reader.readAsText(file);
            };

            const handleMergeImport = () => {
                if (!importData) return;
                setTransactions(prev => {
                    const map = new Map(prev.map(t => [t.id, t]));
                    importData.forEach(t => map.set(t.id, t));
                    return Array.from(map.values());
                });
                showToast(`已合併匯入 ${importData.length} 筆紀錄`);
                setImportData(null);
            };

            const handleOverwriteImport = () => {
                if (!importData) return;
                setTransactions(importData);
                showToast(`已覆蓋匯入 ${importData.length} 筆紀錄`);
                setImportData(null);
            };

            const handleClearAll = () => {

                                Kumamon 記帳
                            </h1>
                            <div className="flex items-center gap-1">
                                <button onClick={handleExportJson} title="匯出 JSON" aria-label="匯出 JSON" className="p-2 text-zinc-500 hover:text-zinc-900 dark:hover:text-white rounded-lg transition-colors"><Icons.Export /></button>
                                <button onClick={handleImportClick} title="匯入 JSON" aria-label="匯入 JSON" className="p-2 text-zinc-500 hover:text-zinc-900 dark:hover:text-white rounded-lg transition-colors"><Icons.Import /></button>
                                <input type="file" accept=".json" className="hidden" ref={fileInputRef} onChange={handleFileChange} />
                                <button onClick={handleExportHtml} title="匯出完整 HTML（含所有紀錄）" aria-label="匯出完整 HTML" className="p-2 text-zinc-500 hover:text-zinc-900 dark:hover:text-white rounded-lg transition-colors"><Icons.FileDown /></button>
                                <button onClick={handleShareToCloud} title="分享至雲端（系統分享：檔案 / iCloud / Drive）" aria-label="系統分享匯出至雲端" className="p-2 text-zinc-500 hover:text-zinc-900 dark:hover:text-white rounded-lg transition-colors"><Icons.Share /></button>
                                <div className="w-px h-4 bg-zinc-300 dark:bg-zinc-700 mx-1"></div>
                                <button onClick={() => setIsSettingsOpen(true)} title="設定" aria-label="設定" className="p-2 text-zinc-500 hover:text-zinc-900 dark:hover:text-white rounded-lg transition-colors"><Icons.Settings /></button>
                                <button onClick={handleClearAll} title="清空資料" aria-label="清空所有資料" className="p-2 text-zinc-500 hover:text-red-600 dark:hover:text-red-400 rounded-lg transition-colors"><Icons.Clear /></button>
                                <button onClick={toggleTheme} title="切換主題" aria-label={theme === 'dark' ? '切換至淺色模式' : '切換至深色模式'} className="p-2 text-zinc-500 hover:text-zinc-900 dark:hover:text-white rounded-lg transition-colors">
                                    {theme === 'dark' ? <Icons.Sun /> : <Icons.Moon />}
                                </button>
                            </div>
                        </div>
                    </header>

                    <main className="max-w-3xl mx-auto px-4 py-6 space-y-6">
                        {recurringCount > 0 && (
                            <div className="flex flex-wrap items-center justify-between gap-2 bg-amber-50 dark:bg-amber-900/20 border border-amber-200 dark:border-amber-800/50 rounded-2xl px-4 py-3">
                                <button type="button" onClick={() => setIsRecurringListOpen(true)}
                                    className="text-sm text-amber-800 dark:text-amber-200 hover:underline text-left">
                                    已設定 <strong>{recurringCount}</strong> 筆週期記帳
                                    <span className="text-xs text-amber-600 dark:text-amber-400 ml-1.5">開啟時自動產生 · 點此檢視／編輯</span>
                                </button>
                                <button type="button" onClick={() => setIsRecurringListOpen(true)}
                                    className="flex items-center gap-1.5 px-3 py-1.5 text-xs font-medium border border-amber-300 dark:border-amber-700 text-amber-800 dark:text-amber-200 hover:bg-amber-100 dark:hover:bg-amber-900/40 rounded-lg transition-colors">
                                    管理
                                </button>
                            </div>
                        )}

                        <div className="space-y-5">
                            {Object.entries(statsByCurrency).filter(([_, stats]) => stats.hasData).map(([currencyKey, stats]) => {
                                const label = CURRENCY_OPTIONS.find(c => c.key === currencyKey)?.label || currencyKey;
                                const symbol = getSymbol(currencyKey);
                                return (
                                    <div key={currencyKey} className="space-y-2">
                                        <h3 className="text-xs font-semibold text-zinc-500 dark:text-zinc-400 ml-0.5">{label}</h3>
                                        <div className="grid grid-cols-1 sm:grid-cols-3 gap-3">
                                            <div className="bg-white dark:bg-zinc-900 p-4 rounded-2xl border border-zinc-100 dark:border-zinc-800 shadow-sm">
                                                <div className="text-xs font-medium text-zinc-500 dark:text-zinc-400 mb-1">結餘</div>
                                                <div className={`text-2xl font-bold font-mono tracking-tight ${stats.balance < 0 ? 'text-red-500' : 'text-zinc-900 dark:text-white'}`}>{formatMoney(stats.balance, symbol)}</div>
                                            </div>
                                            <div className="bg-white dark:bg-zinc-900 p-4 rounded-2xl border border-zinc-100 dark:border-zinc-800 shadow-sm">
                                                <div className="text-xs font-medium text-zinc-500 dark:text-zinc-400 mb-1 flex items-center gap-1"><Icons.TrendingUp /> 收入</div>
                                                <div className="text-2xl font-bold font-mono tracking-tight text-emerald-500">{formatMoney(stats.income, symbol)}</div>
                                            </div>
                                            <div className="bg-white dark:bg-zinc-900 p-4 rounded-2xl border border-zinc-100 dark:border-zinc-800 shadow-sm">
                                                <div className="text-xs font-medium text-zinc-500 dark:text-zinc-400 mb-1 flex items-center gap-1"><Icons.TrendingDown /> 支出</div>
                                                <div className="text-2xl font-bold font-mono tracking-tight text-red-500">{formatMoney(stats.expense, symbol)}</div>
                                            </div>
                                        </div>
                                    </div>
                                );
                            })}
                        </div>

                                        return (
                                            <div key={tx.id} className="p-3.5 sm:p-4 flex items-center justify-between hover:bg-zinc-50 dark:hover:bg-zinc-800/40 transition-colors group">
                                                <div className="flex items-center gap-3 min-w-0">
                                                    <div className={`w-10 h-10 sm:w-11 sm:h-11 rounded-full flex items-center justify-center text-lg shrink-0 ${tx.type === 'income' ? 'bg-emerald-100 text-emerald-600 dark:bg-emerald-900/30 dark:text-emerald-400' : 'bg-red-100 text-red-600 dark:bg-red-900/30 dark:text-red-400'}`}>
                                                        {tx.type === 'income' ? '+' : '−'}
                                                    </div>
                                                    <div className="min-w-0">
                                                        <div className="flex items-center gap-2 flex-wrap">
                                                            <span className="font-semibold text-zinc-900 dark:text-white truncate">{tx.category}</span>
                                                            <span className="text-xs text-zinc-400 shrink-0">{tx.date}</span>
                                                            <span className="text-[10px] px-1.5 py-0.5 rounded bg-zinc-100 dark:bg-zinc-800 text-zinc-500 dark:text-zinc-400">{currencyLabel}</span>
                                                            {tx.recurring && tx.recurring !== 'none' && (
                                                                <span className="text-[10px] px-1.5 py-0.5 rounded bg-amber-100 dark:bg-amber-900/30 text-amber-700 dark:text-amber-300">
                                                                    {recurringLabel}{tx.isRecurringTemplate ? ' · 模板' : ''}
                                                                </span>
                                                            )}
                                                        </div>
                                                        {tx.note && <div className="text-sm text-zinc-500 dark:text-zinc-400 truncate mt-0.5">{tx.note}</div>}
                                                    </div>
                                                </div>
                                                <div className="flex items-center gap-2 sm:gap-3 shrink-0 ml-2">
                                                    <div className={`font-mono font-semibold text-sm sm:text-base ${tx.type === 'income' ? 'text-emerald-600 dark:text-emerald-400' : 'text-zinc-900 dark:text-white'}`}>
                                                        {tx.type === 'income' ? '+' : '−'}{formatMoney(tx.amount, symbol)}
                                                    </div>
                                                    <div className="flex items-center gap-0.5">
                                                        <button onClick={() => { setEditingTx(tx); setIsFormOpen(true); }} className="p-1.5 text-zinc-400 hover:text-zinc-900 dark:hover:text-white transition-colors" title="編輯" aria-label="編輯此紀錄"><Icons.Edit /></button>
                                                        <button onClick={() => handleDelete(tx.id)} className="p-1.5 text-zinc-400 hover:text-red-600 dark:hover:text-red-400 transition-colors" title="刪除" aria-label="刪除此紀錄"><Icons.Trash /></button>
                                                    </div>
                                                </div>
                                            </div>
                                        );
                                    })}
                                </div>
                            )}
                        </div>
                        <p className="text-center text-xs text-zinc-400 pt-2">資料僅儲存在本機瀏覽器 · 共 {transactions.length} 筆紀錄</p>
                    </main>

                    <button onClick={() => { setEditingTx(null); setIsFormOpen(true); }}
                        className="safe-bottom-fab fixed right-6 md:right-8 bg-zinc-900 dark:bg-white text-white dark:text-zinc-900 p-4 rounded-full shadow-lg hover:scale-105 active:scale-95 transition-transform z-40 flex items-center justify-center"
                        title="新增紀錄" aria-label="新增記帳紀錄"><Icons.Plus /></button>

                    {isFormOpen && (
                        <TransactionForm initialData={editingTx} onSave={handleSaveTransaction}
                            onClose={() => { setIsFormOpen(false); setEditingTx(null); }}
                            settings={settings} categories={categories}
                            onAddCategory={(name) => {
                                const n = (name || '').trim();
                                if (!n) return;
                                setCategories(prev => prev.includes(n) ? prev : [...prev, n]);
                            }} />
                    )}
                    {confirmAction && <ConfirmModal {...confirmAction} onClose={() => setConfirmAction(null)} />}
                    {importData && (
                        <ImportModal count={importData.length} onMerge={handleMergeImport}
                            onOverwrite={handleOverwriteImport} onClose={() => setImportData(null)} />
                    )}
                    {isSettingsOpen && (
                        <SettingsModal settings={settings} categories={categories}
                            onSaveSettings={setSettings} onSaveCategories={setCategories}
                            onRenameCategory={handleRenameCategories}
                            onClose={() => setIsSettingsOpen(false)} />
                    )}
                    {isRecurringListOpen && (
                        <RecurringListModal
                            templates={recurringTemplates}
                            getSymbol={getSymbol}
                            onEdit={(tx) => {
                                setIsRecurringListOpen(false);
                                setEditingTx(tx);
                                setIsFormOpen(true);
                            }}
                            onDelete={(id) => {
                                setConfirmAction({
                                    title: '刪除週期模板',
                                    message: '確定要刪除此週期記帳模板嗎？\n之後將不再自動產生對應紀錄。',
                                    isDanger: true,
                                    onConfirm: () => {
                                        setTransactions(prev => prev.filter(tx => tx.id !== id));
                                        showToast('已刪除週期模板');
                                    }
                                });
                            }}
                            onClose={() => setIsRecurringListOpen(false)}
                        />
                    )}
                    {toast && <Toast message={toast.message} type={toast.type} onClose={() => setToast(null)} />}
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>

    <script>
        // 註冊 Service Worker（PWA 離線支援）
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', function () {
                navigator.serviceWorker.register('./sw.js', { scope: './' })
                    .then(function (reg) {
                        console.info('[Kumamon PWA] Service Worker 已註冊', reg.scope);
                        // 有新版本時提示（可選）
                        reg.addEventListener('updatefound', function () {
                            const nw = reg.installing;
                            if (!nw) return;
                            nw.addEventListener('statechange', function () {
                                if (nw.state === 'installed' && navigator.serviceWorker.controller) {
                                    console.info('[Kumamon PWA] 有新版本可用，重新整理即可更新');
                                }
                            });
                        });
                    })
                    .catch(function (err) {
                        console.warn('[Kumamon PWA] Service Worker 註冊失敗', err);
                    });
            });
        }
    </script>
</body>
</html>
